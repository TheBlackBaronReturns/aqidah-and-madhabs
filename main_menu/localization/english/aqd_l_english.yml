 # "Ṣulḥ-i Kul" ("peace/reconciliation with all") is Akbar's own term for
 # the state doctrine din_i_ilahi_school represents in this mod - not a
 # generic "tolerance" but a named Mughal court policy, the actual
 # principle Din-i Ilahi itself grew out of. Replaces the placeholder
 # "Tolerated" - mechanically unchanged (still the single madhhab-
 # agnostic z_aqd_halqa_tolerated object), display name only.
 z_aqd_halqa_tolerated: "Ṣulḥ-i Kul"
 STATIC_MODIFIER_NAME_z_aqd_halqa_tolerated: "Ṣulḥ-i Kul"
 STATIC_MODIFIER_DESC_z_aqd_halqa_tolerated: "A teaching circle is in session here under the ruler's doctrine of ṣulḥ-i kul, peace with all: unrest is easing and learning lent some polish, but conversion is closed off in every direction - no one here is pressed to change their rite."

 # ===================================================================
 # BASE-GAME "madrasa" -> "Maktab" (elementary Qur'an school / kuttab)
 #
 # Localisation-only override. The building key stays `madrasa` so every
 # base system that names it - missions, DHE chains, country setup,
 # muslim_school_events, the great_madrasa upgrade - keeps working
 # untouched. Only presentation changes: the base building is reframed
 # as the elementary town school every quarter had, and the higher-
 # learning flavour that used to hang off it is re-pointed at "the
 # mosque circles and the great colleges that come after" (this mod's
 # halqa / seat-of-jurists layer). The genuinely grand institutions
 # keep their own keys and stay "Madrasa": great_madrasa,
 # al_azhar_madrasa, mahmud_gawan_madrasa, and the Sankore art/advance.
 #
 # These are loc keys, not script - if a future patch renames a key,
 # the override simply goes unused and the base string returns.
 # ===================================================================

 # ---- The building itself + its maintenance good ----
 madrasa: "Maktab"
 madrasa_desc: "A maktab - also called a kuttab - is the elementary school of the Muslim town, found in almost every quarter and in most villages. Under a single schoolmaster the children of the district learn to read and write Arabic, to recite and commit to memory the $common_string_quran$, and to reckon simple sums; some also teach the rudiments of grammar and the lives of the pious. It is where the faith and the letters are first handed to the young. The deeper study of law and doctrine belongs to the mosque circles and the great colleges that come after."
 madrasa_maintenance: "Maktabs"

 # ---- Static modifiers named after the building ----
 STATIC_MODIFIER_NAME_muslim_madrassa: "Supported Maktabs"
 STATIC_MODIFIER_NAME_expanded_madrasah: "Renowned Maktab"
 STATIC_MODIFIER_NAME_hampered_expansion_of_madrasah: "Hampered Maktab Expansion"
 STATIC_MODIFIER_NAME_new_madrasas_modifier: "New Maktabs"

 # ---- muslim_flavor.21: what the building is ----
 muslim_flavor.21.title: "The Schooling of the Young"
 muslim_flavor.21.desc: "In every quarter of every town stands a [ShowBuildingTypeName('madrasa')], where a schoolmaster gathers the children of the district to learn their letters, to write, and to recite and memorise the $common_string_quran$. Some also teach a little grammar, arithmetic, and the lives of the pious. It is humble work - but the future of the land lies in the hands of these children, and a realm that sees them taught is a realm that can trust them with its future."
 muslim_flavor.21.a: "Support our [ShowBuildingTypeNameWithNoTooltip('madrasa')]!"
 muslim_flavor.21.b: "Do nothing."

 # ---- muslim_school_events.1: a gifted pupil rises to the bench ----
 muslim_school_events.1.desc: "A career in law begins early. A boy learns his letters and the $common_string_quran$ at the [ShowBuildingTypeName('madrasa')] of his town, and only the ablest go on to years of study under the $rank_county_arabic_ruler_male$ of the mosque circles and the colleges, collecting an 'Ijāza for each work they master.\n\nOne such student, who first learned to read at the [ShowBuildingTypeNameWithNoTooltip('madrasa')] in [mufti_province.GetName], has lately been making a very good impression around the country. Those who taught him expect a great career as a Qāḍī or Muftī ahead of him."

 # ---- muslim_school_events.3: a town's maktab graduates to a full college ----
 muslim_school_events.3.title: "A Madrasa for [madrassah_province.GetNameWithNoTooltip]"
 muslim_school_events.3.desc: "[madrassah_province.GetName] already has its mosque and its [ShowBuildingTypeName('madrasa')], and its children are well taught. Now the prominent citizens of [madrassah_province.GetProvince.GetName] have made a number of charitable donations to found something greater - a proper madrasa, a college of higher learning. They have invited scholars from across [madrassah_province.GetProvince.GetNameWithNoTooltip] and from other parts of our territory, and even foreign theologians."

 # ---- muslim_school_events.9: foreign scholars hosted in our schools ----
 muslim_school_events.9.desc: "By hosting [SCOPE.sCountry('scholar_country').GetAdjectiveWithNoTooltip] scholars in our schools we are not only improving the theological discussion in our country but also improving our ties with the [SCOPE.sCountry('scholar_country').GetName] [SCOPE.sCountry('scholar_country').GetGovernment.GetGovernmentType.GetName]."

 # ---- muslim_school_events.16: a town's maktab wins renown ----
 muslim_school_events.16.title: "The Maktab of [madrasa_province.GetNameWithNoTooltip]"
 muslim_school_events.16.desc: "The [ShowBuildingTypeName('madrasa')] of [madrasa_province.GetName] has earned a name for itself - not only for teaching the young their letters and the $common_string_quran$, but for the reputation of the men who teach there. [inv_school.GetName] scholars passing through have lent it a further shine, and pupils now come from well beyond the district; the adjoining market and the city as a whole are the busier for it.\n\nSuch growth still has to be paid for. If [target_ruler.GetName] [target_ruler.GetHerselfHimself] would set aside a larger charitable endowment for its upkeep, it would benefit both the town and the country at large."

 # ---- mission: still 'Islamic Colleges' (also counts great_madrasa) ----
 mission_islamic_colleges_desc: "The teaching of scripture and the preservation of knowledge are our solemn duty. We must plant maktabs through our towns so the young may learn the $common_string_quran$ and their letters, and raise up great madrasas where that learning can ripen into true scholarship."

 # ---- Incidental prose: de-token where it clearly means a college ----
 flavor_tur.16.desc: "There is turmoil in [ShowRegionName('anatolia_region')]. Madrasa students, irregular Sekban soldiers, and minor officials have joined forces under a [ShowReligionAdjective('shia')] preacher named [sheikh_celal.GetName], enraged by financial woes. They have begun riots in many provinces, and demand lower taxes, less government meddling in local affairs, and more respect for the [ShowReligionAdjectiveWithNoTooltip('shia')] faithful."
 flavor_tur.133.desc: "The many scholars among the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are finding it more and more difficult to find work. While Qāḍī are always in demand, those positions are coveted and highly competitive, and there is not enough for all. Fathers are now advising their sons not to become scholars, and perhaps not even study in the madrasa at all. They miss now, the scholars say, the days of 'Alī al-Qawshajī and Taqī ad-Dīn, when science of all kinds was still appreciated by the state."
 waqf_payments_desc: "To demonstrate our piety and religious dedication, we will grant #italic waqf#! payments as charitable endowments, which shall be used to fund maktabs and madrasas, hospitals, and mosques, as well as to aid the less fortunate."

 # ---- The Jurists' Fatwa Against an Unjust War (z_aqd_fatwa_events.txt) ----
 # .desc.favored / .desc.neutral: root's own aqidah judges the enemy's
 # madhhab favored (1) or merely neutral (0) - heterodox (-1) can never
 # reach this event, by construction of aqd_fatwa_core_conditions.
 z_aqd_fatwa.1.title: "A Fatwa Against This War"
 z_aqd_fatwa.1.desc.favored: "The jurists of [target_location.GetName] have issued a fatwa: this war against [SCOPE.sCountry('enemy').GetName], a fellow Muslim state whose own rite our scholars hold sound, rests on no true cause, and the bloodshed must end. They ask that peace be made now, while it can still be made with honour."
 z_aqd_fatwa.1.desc.neutral: "The jurists of [target_location.GetName] have issued a fatwa: this war against [SCOPE.sCountry('enemy').GetName], a fellow Muslim state whose own rite our scholars do not condemn, rests on no true cause, and the bloodshed must end. They ask that peace be made now, while it can still be made with honour."
 z_aqd_fatwa.1.desc.fallback: "DEBUG/fallback: no matching war or jurist seat was found to name here - this text renders when the event is force-fired with no real target, so nothing crashes. Under a real fire this should never be seen."
 z_aqd_fatwa.1.accept: "Heed the fatwa and sue for peace"
 z_aqd_fatwa.1.refuse: "The war will continue"

 z_aqd_fatwa.2.title: "The Jurists Speak as One"
 z_aqd_fatwa.2.desc.favored: "Word of the fatwa against [SCOPE.sCountry('enemy').GetName] has spread. Other jurists' seats across the region are adding their voice to the first: this war against a fellow Muslim state whose own rite our scholars hold sound has dragged on far too long, and must end."
 z_aqd_fatwa.2.desc.neutral: "Word of the fatwa against [SCOPE.sCountry('enemy').GetName] has spread. Other jurists' seats across the region are adding their voice to the first: this war against a fellow Muslim state whose own rite our scholars do not condemn has dragged on far too long, and must end."
 z_aqd_fatwa.2.desc.fallback: "DEBUG/fallback: no matching war or jurist seat was found to name here - this text renders when the event is force-fired with no real target, so nothing crashes. Under a real fire this should never be seen."
 z_aqd_fatwa.2.accept: "Make peace, as they demand"
 z_aqd_fatwa.2.refuse: "Their displeasure changes nothing"

 # ---- The Fatwa of Jihad (events/religion/z_aqd_jihad_fatwa_events.txt) ----
 # Silent-miss design: this event only ever fires once a seat's approval
 # roll already succeeded (scripted_effects/z_aqd_jihad_fatwa_effects.txt's
 # aqd_jihad_fatwa_attempt), so there is no "declined" desc variant to
 # write - unlike z_aqd_fatwa.1/.2 above.
 z_aqd_jfatwa.1.title: "A Fatwa for the Jihad"
 # 9 concrete desc branches, NOT $aqd_seat_madhhab_name$ - that customizable
 # localization (common/customizable_localization/z_aqd_seat_madhhab_name.txt)
 # checks has_building, a LOCATION-scoped trigger, but was invoked bare from
 # here, which renders at this event's default scope (root, the country),
 # never at scope:target_location (the seat) - so every one of its 9
 # branches silently failed to match and the name came out blank. Confirmed
 # the failure the file's own header comment had flagged as unverified risk
 # before shipping. Fixed per that same comment's documented fallback.
 z_aqd_jfatwa.1.desc.hanafi: "The Ḥanafī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.hanbali: "The Ḥanbalī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.maliki: "The Mālikī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.shafii: "The Shāfi'ī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.zahiri: "The Ẓāhirī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.ismaili: "The Ismā'īlī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.jafari: "The Ja'farī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.zaidi: "The Zaydī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.ibadi: "The Ibāḍī jurists of [target_location.GetName] have proclaimed a fatwa: every able-bodied believer is called to take up arms in the jihad against [SCOPE.sCountry('enemy').GetName]."
 z_aqd_jfatwa.1.desc.fallback: "DEBUG/fallback: no matching jihad or jurist seat was found to name here - this text renders when the event is force-fired with no real target, so nothing crashes. Under a real fire this should never be seen."
 z_aqd_jfatwa.1.ok: "So it is proclaimed"

