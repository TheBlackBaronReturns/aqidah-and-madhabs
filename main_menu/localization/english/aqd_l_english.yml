 z_aqd_halqa.1.desc.orthodox.ibadi: "The Ibāḍī scholars, a school our own creed holds sound, keep a teaching circle in a province of the realm. The muftis' answers settle more disputes than they raise, some of the province's dissenting Muslims are won over to the ruler's rite, and the realm's thinking turns a little further toward the spiritual for it."
 z_aqd_halqa.1.desc.heterodox.hanafi: "In a province of the realm, the circle of the Ḥanafī school, one our creed cannot abide, meets all the same, its mudarris well attended. Our own clergy will not be swayed toward the visitors' rite at all, and the wider Muslim populace only slowly; word of the circle has stirred real unrest - and a fifth of the state-religion faithful around the seat itself, with a tenth more across the rest of the province, have already gone over to the visitors' way."
