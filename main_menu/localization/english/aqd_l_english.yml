 z_aqd_halqa.1.desc.tolerated.hanafi: "The Ḥanafī teaching circle in a province of the realm keeps its season under the ruler's doctrine of ṣulḥ-i kul, peace with all. No rite is pressed on anyone and none is driven out; the province simply goes about its learning, and is the calmer for being left alone."
