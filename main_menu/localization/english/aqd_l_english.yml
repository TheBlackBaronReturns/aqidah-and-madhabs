l_english:
 # ---- Schools of creed (Twelver Shia) ----
 usuli_school: "Usuli School"
 usuli_school_desc: "The rationalist Twelver school: the qualified jurist (mujtahid) may reason from the sources, and the believer follows a living authority."
 akhbari_school: "Akhbari School"
 akhbari_school_desc: "The traditionist Twelver school: only the reports (akhbar) of the Imams bind, and independent legal reasoning is mistrusted."

 # ---- Schools of creed (Ibadi) ----
 wahbi_school: "Wahbi School"
 wahbi_school_desc: "The mainstream Ibadi school of creed, tracing to 'Abd Allah ibn Ibad and the teachings of Jabir ibn Zayd. Moderate where the wider Kharijite movement it grew from was not, it rejects takfir against other $muslim_ADJ$ branches and holds the imamate to be earned through the community's choice of the most qualified, not lineage. The Wahbiyya is the only branch of Ibadism to survive to the present day. This form holds to a sovereign elected Imam, as continuously practiced in Oman."
 azzaba_school: "Azzaba School"
 azzaba_school_desc: "The same Wahbiyya creed as $wahbi_school$, but organized around the halqat al-'ilm - the 'circle of knowledge' - rather than a ruling Imam. Communal life is administered by scholarly councils, the 'azzaba, a system that let Ibadi identity endure across the Maghreb - the Mzab, Jabal Nafusa, Djerba, and Wargla - for a thousand years after the Rustamid Imamate of Tahert fell in 909."

 # ---- Actions ----
 aqd_change_madhhab: "Change the Madhhab"
 aqd_change_madhhab_desc: "Adopt a different school of jurisprudence for your realm's courts. A deliberate act, paid for in stability."
 aqd_madhhab_select: "Which madhhab?"
 aqd_madhhab_none: "@trigger_no! No other madhhab is open to your confession."

 aqd_crackdown_madhhab: "Crack Down on Jurists"
 aqd_crackdown_madhhab_desc: "Move against a rival madhhab's institutions in your realm - closing courts, and if need be a seat itself, until its standing is broken back by one degree. The Ulema will not forget it quickly."
 aqd_crackdown_gold_tt: "Seize up to #Y [SCOPE.sCountry('actor').MakeScope.GetVariable('aqd_crackdown_gold_est').GetValue|V0]@gold!#! in confiscated endowments"
 aqd_crackdown_select: "Crack down on which madhhab?"
 aqd_crackdown_none: "@trigger_no! No rival madhhab has enough of a foothold in your realm to crack down on."

 # ---- Ulema Institutions: Jurist Seats ----
 seat_of_hanafi_jurists: "Seat of Hanafi Jurists"
 seat_of_hanafi_jurists_desc: "A standing institution of Hanafi jurisprudence, seat of scholars who train and appoint qadis in the school's method."
