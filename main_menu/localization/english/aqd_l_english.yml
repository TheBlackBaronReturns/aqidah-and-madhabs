 # ---- Ulema Institutions: madhhab madrasas ----
 madrasa_of_hanafi_fiqh: "Hanafi Madrasa"
 madrasa_of_hanafi_fiqh_desc: "A local college of Hanafi fiqh, endowed by the district's notables, where students read the school's law under resident jurists. It is buildable for your realm's own madhhab anywhere its people are numerous; for any other, only in an area where your realm already holds a Seat of that school. Where three take root in one province beside a working mosque, and a city to house it, its jurists may petition to found a standing Seat."
