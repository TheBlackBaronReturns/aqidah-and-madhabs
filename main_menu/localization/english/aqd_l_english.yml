 # fill_pending.txt, z_aqd_vacuum_fill_madrasa_pending.txt) - always
 # stamped and consumed within the same effect chain (or, for the
 # madrasa marker on a failed roll, simply left to expire unused), so
 # these names should never actually be visible; kept only as a safety
 # net. ----
 z_aqd_seat_collapse_pending: "A Seat's Fate Is Being Weighed"
