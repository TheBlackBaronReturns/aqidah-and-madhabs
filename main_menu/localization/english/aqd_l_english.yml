 # ---- Ulema Institutions: foreign jurists event ----
 z_aqd_jurists.1.title: "Foreign Jurists at the Gate"
 # [scope:aqd_jurists_seat_loc.GetName] does NOT resolve (see the Halqa
 # section below for the confirmed debug.log evidence) - reverted to the
 # single generic desc rather than a dead "named" variant.
 z_aqd_jurists.1.desc: "A party of jurists from a neighboring land has arrived, asking leave to establish their school of law in your realm - to raise a Seat in one of your cities, a standing authority to train and appoint the qadis of their method. Your own ulema watch closely to see what you will do."
 z_aqd_jurists.1.grant_seat: "Let them raise a Seat"
 z_aqd_jurists.1.endow: "Raise their Seat, and endow a college beside it"
 z_aqd_jurists.1.refuse: "Turn them away"
 aqd_endow_gold_tt: "Spend #Y[ROOT.GetVariable('aqd_endow_gold_est').GetValue|V0]@gold!#! to endow their college"

 # ---- Ulema Institutions: seat establishment ----
 z_aqd_establishment.1.title: "A School Puts Down Roots"
 z_aqd_establishment.1.desc: "The madrasas of one school of jurisprudence have multiplied across a province of the realm, and now stand in strength beside its mosques. Its jurists ask leave to raise a permanent Seat in one of the province's cities - a standing authority to train and appoint the qadis of their school. Grant it, and the school is anchored in your realm for good. Refuse, and your officers must move against its colleges instead."
 z_aqd_establishment.1.allow: "Let them raise their Seat"
 z_aqd_establishment.1.crackdown: "Move against the school"
 aqd_crackdown_gold_result_tt: "Seize up to #Y [ROOT.GetVariable('aqd_crackdown_gold_est').GetValue|V0]@gold!#! in confiscated endowments"
 z_aqd_establishment_pending: "Jurists Petitioning"
 STATIC_MODIFIER_NAME_z_aqd_establishment_pending: "Jurists Petitioning"
 STATIC_MODIFIER_DESC_z_aqd_establishment_pending: "The question of a jurists' Seat here has recently been settled. It will not be raised again for some years."

 # ---- Ulema Institutions: exiled jurists find refuge ----
 z_aqd_exile.1.title: "Jurists in Exile"
 z_aqd_exile.1.desc: "Jurists of a school of law driven out of a neighboring realm have crossed into our lands, asking leave to raise a permanent Seat of their school in one of our cities - a standing authority to train and appoint the qadis of their method. Our own ulema are watching to see whether we will shelter them."
 z_aqd_exile.1.accept: "Shelter them - let them raise a Seat"
 z_aqd_exile.1.refuse: "Send them on their way"

 # ---- Ulema Institutions: the Halqa (jurist-seat activity) ----
 # Dynamic province/city naming via [scope:X.GetName] does NOT work for a
 # custom save_scope_as name - confirmed in debug.log: "Failed to find
 # type 'scope:halqa_loc' in 'scope:halqa_loc.GetName'" /
 # "Data error in loc string 'z_aqd_halqa.1.desc...'". No base-game event
 # anywhere names a random_owned_location-derived scope this way either
 # (only the reserved/engine-known scope:actor / scope:winner resolve).
 # Matches z_aqd_establishment.1.desc's existing "a province of the
 # realm" phrasing below - not a location-naming bug specific to this
 # event, apparently an engine-wide limit on custom scope names in loc.
 # This limit is about the LOCATION's name only - it says nothing about
 # naming the MADHHAB, which var:aqd_halqa_madhhab (a plain variable, not
 # a scope name) makes perfectly resolvable. The 4 keys below are now
 # per-class FALLBACKS only (events/religion/z_aqd_halqa_events.txt's
 # desc dispatches to a madhhab-specific variant first, same as z_aqd_
 # jfatwa.1's own desc) - kept verbatim, generic wording and all, since
 # they're only ever reached if var:aqd_halqa_madhhab is somehow unset.
 z_aqd_halqa.1.title: "A Circle Convenes"
 z_aqd_halqa.1.ok: "The circle continues"
 z_aqd_halqa.1.desc.state: "In a province of the realm, the qadis and students of the realm's own school of law keep their teaching circle through the season. Its rulings run with the grain of the state, unrest eases, and waverers among the other Muslims are drawn back toward the ruler's rite - a fifth of them around the seat itself, a tenth more across the rest of the province."
 z_aqd_halqa.1.desc.orthodox: "The scholars of a school our own creed holds sound keep a teaching circle in a province of the realm. The muftis' answers settle more disputes than they raise, some of the province's dissenting Muslims are won over to the ruler's rite, and the realm's thinking turns a little further toward the spiritual for it."
 z_aqd_halqa.1.desc.heterodox: "In a province of the realm, the circle of a school our creed cannot abide meets all the same, its mudarris well attended. Our own clergy will not be swayed toward the visitors' rite at all, and the wider Muslim populace only slowly; word of the circle has stirred real unrest - and a fifth of the state-religion faithful around the seat itself, with a tenth more across the rest of the province, have already gone over to the visitors' way."
 z_aqd_halqa.1.desc.tolerated: "The teaching circle in a province of the realm keeps its season under the ruler's doctrine of ṣulḥ-i kul, peace with all. No rite is pressed on anyone and none is driven out; the province simply goes about its learning, and is the calmer for being left alone."

 # Madhhab-specific variants of the four keys above - same paragraphs,
 # with the generic "the realm's own school of law" / "a school our own
 # creed holds sound" / "a school our creed cannot abide" / (tolerated's
 # unnamed circle) phrase replaced by the specific rite. Diacritic
 # spellings match aqd_seat_madhhab_name_<X> elsewhere in this file.
