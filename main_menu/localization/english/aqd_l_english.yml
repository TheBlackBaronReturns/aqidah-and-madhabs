 z_aqd_halqa.1.desc.state.ibadi: "In a province of the realm, the qadis and students of the Ibāḍī school of law keep their teaching circle through the season. Its rulings run with the grain of the state, unrest eases, and waverers among the other Muslims are drawn back toward the ruler's rite - a fifth of them around the seat itself, a tenth more across the rest of the province."
 z_aqd_halqa.1.desc.orthodox.hanafi: "The Ḥanafī scholars, a school our own creed holds sound, keep a teaching circle in a province of the realm. The muftis' answers settle more disputes than they raise, some of the province's dissenting Muslims are won over to the ruler's rite, and the realm's thinking turns a little further toward the spiritual for it."
 z_aqd_halqa.1.desc.orthodox.hanbali: "The Ḥanbalī scholars, a school our own creed holds sound, keep a teaching circle in a province of the realm. The muftis' answers settle more disputes than they raise, some of the province's dissenting Muslims are won over to the ruler's rite, and the realm's thinking turns a little further toward the spiritual for it."
