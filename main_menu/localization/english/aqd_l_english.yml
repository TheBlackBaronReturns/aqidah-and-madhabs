 z_aqd_debate.1.desc.main: "The jurists of [debate_location_a.GetName] and the jurists of [debate_location_b.GetName] have come to blows over a fine point of fiqh, each convinced the other has strayed from sound doctrine. Students take sides in the streets, and the dispute threatens to spill beyond the walls of the madrasa unless the throne intervenes - or wisely does not."
