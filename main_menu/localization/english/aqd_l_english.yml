 # ---- Crackdown Vacancy (events/religion/z_aqd_crackdown_vacancy_
 # events.txt) - names the razed madhhab directly (9-way, safe: only one
 # dynamic name to resolve), never which replacement wins - that isn't
 # known until the chosen option itself resolves. ----
