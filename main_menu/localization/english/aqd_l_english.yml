 z_aqd_seat_collapse.1.desc.ibadi: "The Ibāḍī seat of [collapse_location.GetName] has fallen silent. The faithful of its rite have all but vanished here, and with no students left to teach, its madrasas close along with it."
 z_aqd_seat_collapse.1.desc.fallback: "DEBUG/fallback: no matching collapsing seat was found to name here - this text renders when the event is force-fired with no real target, so nothing crashes. Under a real fire this should never be seen."
 z_aqd_seat_collapse.1.ok: "So it ends"

 # z_aqd_seat_collapse.2 (vacuum filled) names BOTH locations and no
 # madhhab at all - see this file's own top-of-file header for why.
 z_aqd_seat_collapse.2.title: "A Vacancy Filled"
 z_aqd_seat_collapse.2.desc.main: "The seat of [collapse_location.GetName] has fallen silent, its faithful dwindled past recall - but word travels fast among the jurists. Before the college halls stand empty for long, the jurists of [vacuum_candidate_location.GetName] step into the vacancy, and every madrasa here that once taught the old rite now teaches theirs instead."
 z_aqd_seat_collapse.2.desc.fallback: "DEBUG/fallback: no matching collapsing seat or vacuum-filling candidate was found to name here - this text renders when the event is force-fired with no real target, so nothing crashes. Under a real fire this should never be seen."
 z_aqd_seat_collapse.2.ok: "The vacancy is filled"

 # ---- Seat collapse's three dedicated same-tick markers (main_menu/
