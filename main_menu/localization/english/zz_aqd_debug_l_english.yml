l_english:
 z_aqd_debug.1.t: "DEBUG: seed halqa buildings"
 z_aqd_debug.1.d: "Places a jurist seat + madrasas of the chosen madhhab across your capital province, so z_aqd_halqa.1 has something to work with."
 z_aqd_debug.1.hanafi: "Hanafi seat + madrasas"
 z_aqd_debug.1.hanbali: "Hanbali seat + madrasas"
 z_aqd_debug.1.maliki: "Maliki seat + madrasas"
 z_aqd_debug.1.jafari: "Jafari seat + madrasas"
 z_aqd_debug.1.ibadi: "Ibadi seat + madrasas"
 z_aqd_debug.1.cancel: "Cancel"
 z_aqd_debug.2.t: "DEBUG: set aqidah"
 z_aqd_debug.2.d: "Sets your realm's religious_school so a seat can be read as orthodox / heterodox / tolerated."
 z_aqd_debug.2.ashari: "Ashari (Sunni)"
 z_aqd_debug.2.athari: "Athari (Sunni)"
 z_aqd_debug.2.imamiya: "Imamiya (Twelver Shia)"
 z_aqd_debug.2.dinilahi: "Din-i Ilahi"
 z_aqd_debug.2.cancel: "Cancel"
 z_aqd_debug.3.t: "DEBUG: clear halqa"
 z_aqd_debug.3.d: "Removes any active halqa modifier from your capital province so the event can be re-tested there."
 z_aqd_debug.3.clear: "Clear it"
 z_aqd_debug.3.cancel: "Cancel"
 z_aqd_debug.4.t: "DEBUG: why is Ahi (not) eligible?"
 z_aqd_debug.4.desc.no_ahi: "RESULT: c:AHI does not exist (annexed, or this bookmark has no Ahi). Pick a different tag to test against, or edit this event."
 z_aqd_debug.4.desc.eligible: "RESULT: aqd_is_eligible_jurist_source is TRUE for Ahi right now. If z_aqd_jurists.1 still does nothing, the problem is downstream of eligibility (aqd_jurists_derive_seat_target / aqd_jurists_accept), not aqd_is_eligible_jurist_source itself - report this back."
 z_aqd_debug.4.desc.not_neighbor: "RESULT: FALSE - Ahi is not among your any_neighbor_country list right now (no land border / not within one sea zone by this trigger's definition), regardless of the map looking adjacent."
 z_aqd_debug.4.desc.not_muslim: "RESULT: FALSE - Ahi's religion.group is not religion_group:muslim right now (possibly converted, or the base game's shia religion is not actually grouped under muslim in this game version)."
 z_aqd_debug.4.desc.no_jafari: "RESULT: FALSE - Ahi does not currently hold jafari_policy (their madhhab sub-policy), despite being Shia. Check Ahi's religion/law panel directly."
 z_aqd_debug.4.desc.we_have_jafari: "RESULT: FALSE - WE already hold jafari_policy ourselves (aqd_is_eligible_jurist_source never offers your own madhhab as foreign)."
 z_aqd_debug.4.desc.tier_high: "RESULT: FALSE - our own jafari_institution_tier is already 3 (Plurality) or higher, so the source is no longer offered."
 z_aqd_debug.4.desc.unknown: "RESULT: every named condition passed but aqd_is_eligible_jurist_source is still false - the OR-branch dispatch itself may be at fault. Report this back."
 z_aqd_debug.4.ok: "Noted"
 z_aqd_debug.5.t: "DEBUG: force fatwa events"
 z_aqd_debug.5.d: "Force-fires the fatwa demand/escalation events directly (bypassing their own trigger), or clears their cooldown/stage variables for a repeat test. Does not set up a real war for you - only proves the event body itself works."
 z_aqd_debug.5.force1: "Force z_aqd_fatwa.1 (the demand)"
 z_aqd_debug.5.force2: "Force z_aqd_fatwa.2 (the escalation)"
 z_aqd_debug.5.forcejihad: "Force z_aqd_jfatwa.1 (the Fatwa of Jihad)"
 z_aqd_debug.5.clearvars: "Clear fatwa cooldown/stage variables"
 z_aqd_debug.5.cancel: "Cancel"
