l_english:
 z_aqd_debug.1.t: "DEBUG: seed halqa buildings"
 z_aqd_debug.1.d: "Places a jurist seat + madrasas of the chosen madhhab across your capital province, so z_aqd_halqa.1 has something to work with."
 z_aqd_debug.1.hanafi: "Hanafi seat + madrasas"
 z_aqd_debug.1.hanbali: "Hanbali seat + madrasas"
 z_aqd_debug.1.maliki: "Maliki seat + madrasas"
 z_aqd_debug.1.jafari: "Jafari seat + madrasas"
 z_aqd_debug.1.ibadi: "Ibadi seat + madrasas"
 z_aqd_debug.1.cancel: "Cancel"
 z_aqd_debug.2.t: "DEBUG: set aqidah"
 z_aqd_debug.2.d: "Sets your realm's religious_school so a seat can be read as orthodox / heterodox / tolerated."
 z_aqd_debug.2.ashari: "Ashari (Sunni)"
 z_aqd_debug.2.athari: "Athari (Sunni)"
 z_aqd_debug.2.imamiya: "Imamiya (Twelver Shia)"
 z_aqd_debug.2.dinilahi: "Din-i Ilahi"
 z_aqd_debug.2.cancel: "Cancel"
 z_aqd_debug.3.t: "DEBUG: clear halqa"
 z_aqd_debug.3.d: "Removes any active halqa modifier from your capital province so the event can be re-tested there."
 z_aqd_debug.3.clear: "Clear it"
 z_aqd_debug.3.cancel: "Cancel"
 z_aqd_debug.5.t: "DEBUG: force fatwa events"
 z_aqd_debug.5.d: "Force-fires the fatwa demand/escalation events directly (bypassing their own trigger), or clears their cooldown/stage variables for a repeat test. Does not set up a real war for you - only proves the event body itself works."
 z_aqd_debug.5.force1: "Force z_aqd_fatwa.1 (the demand)"
 z_aqd_debug.5.force2: "Force z_aqd_fatwa.2 (the escalation)"
 z_aqd_debug.5.forcejihad: "Force z_aqd_jfatwa.1 (the Fatwa of Jihad)"
 z_aqd_debug.5.clearvars: "Clear fatwa cooldown/stage variables"
 z_aqd_debug.5.cancel: "Cancel"
